name: Verify wagering MVP
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.0.3
        env:
          SERVICES: sqs
          SQS_ENDPOINT_STRATEGY: dynamic
        ports: ['4566:4566']
        options: >-
          --health-cmd "awslocal sqs list-queues"
          --health-interval 3s --health-timeout 5s --health-retries 40
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jungle
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: jungle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jungle -d jungle_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://jungle:test_only@127.0.0.1:5432/jungle_test
      SQS_ENDPOINT: http://127.0.0.1:4566
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run check:all
